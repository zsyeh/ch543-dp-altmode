name: build-and-test
on: [push, pull_request, workflow_dispatch]
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sdcc
      - run: make test sanitize firmware
      - uses: actions/upload-artifact@v4
        with:
          name: ch543-experimental-firmware
          path: |
            build/*.hex
            build/*.ihx
            build/*.map
            build/*.mem
            build/*.resources.*
